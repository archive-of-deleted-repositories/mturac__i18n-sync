name: i18n-sync Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugin.json exists and is valid JSON
        run: |
          if [ ! -f ".claude-plugin/plugin.json" ]; then
            echo "ERROR: .claude-plugin/plugin.json not found"
            exit 1
          fi
          jq empty .claude-plugin/plugin.json && echo "plugin.json is valid JSON"

      - name: Validate marketplace.json exists and is valid JSON
        run: |
          if [ ! -f ".claude-plugin/marketplace.json" ]; then
            echo "ERROR: .claude-plugin/marketplace.json not found"
            exit 1
          fi
          jq empty .claude-plugin/marketplace.json && echo "marketplace.json is valid JSON"

      - name: Check required plugin.json fields
        run: |
          NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          AUTHOR=$(jq -r '.author' .claude-plugin/plugin.json)
          SKILLS=$(jq '.skills | length' .claude-plugin/plugin.json)
          COMMANDS=$(jq '.commands | length' .claude-plugin/plugin.json)

          [ "$NAME" = "i18n-sync" ]   || { echo "ERROR: name must be i18n-sync, got $NAME"; exit 1; }
          [ -n "$VERSION" ]           || { echo "ERROR: version is missing"; exit 1; }
          [ -n "$AUTHOR" ]            || { echo "ERROR: author is missing"; exit 1; }
          [ "$SKILLS" -gt 0 ]         || { echo "ERROR: skills array is empty"; exit 1; }
          [ "$COMMANDS" -gt 0 ]       || { echo "ERROR: commands array is empty"; exit 1; }

          echo "plugin.json fields: name=$NAME version=$VERSION author=$AUTHOR skills=$SKILLS commands=$COMMANDS"

      - name: Check all skill SKILL.md files exist
        run: |
          MISSING=0
          while IFS= read -r skill_file; do
            if [ ! -f "$skill_file" ]; then
              echo "ERROR: Missing skill file: $skill_file"
              MISSING=1
            else
              echo "OK: $skill_file"
            fi
          done < <(jq -r '.skills[].file' .claude-plugin/plugin.json)
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Check all command files exist
        run: |
          MISSING=0
          while IFS= read -r cmd_file; do
            if [ ! -f "$cmd_file" ]; then
              echo "ERROR: Missing command file: $cmd_file"
              MISSING=1
            else
              echo "OK: $cmd_file"
            fi
          done < <(jq -r '.commands[].file' .claude-plugin/plugin.json)
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Check SKILL.md files have required frontmatter
        run: |
          FAIL=0
          for skill_md in skills/*/SKILL.md; do
            if ! grep -q "^name:" "$skill_md"; then
              echo "ERROR: $skill_md missing 'name:' in frontmatter"
              FAIL=1
            fi
            if ! grep -q "^description:" "$skill_md"; then
              echo "ERROR: $skill_md missing 'description:' in frontmatter"
              FAIL=1
            fi
            if ! grep -q "^version:" "$skill_md"; then
              echo "ERROR: $skill_md missing 'version:' in frontmatter"
              FAIL=1
            fi
            echo "OK: $skill_md"
          done
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Check command files have a title heading
        run: |
          FAIL=0
          for cmd_md in commands/*.md; do
            if ! grep -q "^# /" "$cmd_md"; then
              echo "ERROR: $cmd_md missing '# /command-name' heading"
              FAIL=1
            fi
            echo "OK: $cmd_md"
          done
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Summary
        run: echo "All plugin structure checks passed."
